name: Debian Packages

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-deb:
    name: deb (${{ matrix.suite }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [bookworm, trixie, sid]
    container: debian:${{ matrix.suite }}
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates git \
            dpkg-dev debhelper dh-python pybuild-plugin-pyproject \
            python3-all python3-hatchling python3-hatch-vcs python3-setuptools-scm \
            python3-paho-mqtt python3-pytest python3-requests

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Trust repo directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Set changelog version from git
        run: python3 packaging/deb-version.py --write-changelog

      - name: Build packages
        run: dpkg-buildpackage -us -uc

      - name: Collect debs
        run: |
          mkdir -p built-debs
          cp ../*.deb built-debs/

      - uses: actions/upload-artifact@v4
        with:
          name: debs-${{ matrix.suite }}
          path: built-debs/
          if-no-files-found: error

  publish-apt:
    # Build on PRs to validate, but never publish from one: that would
    # overwrite the live repository with unreviewed packages.
    if: github.event_name != 'pull_request'
    needs: build-deb
    uses: mithro/apt-repo-action/.github/workflows/publish-apt.yml@main
    with:
      suites: "bookworm trixie sid"
      # dh-python builds these Architecture: all; one deb serves every arch.
      architectures: "all"
      origin: sensors2mqtt
      description: "Publish hardware sensor data to Home Assistant via MQTT"
      keyring-name: sensors2mqtt.gpg
    secrets:
      gpg-private-key: ${{ secrets.APT_GPG_PRIVATE_KEY }}
