name: Debian packages

# Rolling release: every push to main tests, builds the sensors2mqtt packages
# for each suite, and republishes a signed apt repository per suite on GitHub
# Pages (https://mith.ro/sensors2mqtt/<suite>/). The packages are all
# Architecture: all (dh-python), so one x86 build per suite serves every
# architecture. A pull request runs the same tests and builds, and publishes
# nothing.
#
# This follows mithro/apt-repo-action's docs/packaging.md; the differences
# from its defaults are declared in .github/apt-packaging.toml.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege by default: only the publish job below raises this, and only
# for itself. The build jobs run Docker, so they should never hold a token
# that can write to Pages.
permissions:
  contents: read

concurrency:
  group: deb-${{ github.ref }}
  # A newer push to a pull request cancels the older build. On the default
  # branch a running publish is never cancelled: the newest push waits for it,
  # and replaces any older push still waiting (it contains that one's commits).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # The project's own tests and lint, on each Python it supports. The
    # package build runs the tests again, against each suite's packages.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      # The build generates debian/changelog: apt-repo-action's shared
      # scripts/deb-version.py writes the build's entry, with the version
      # derived from git. Committing a build's output would pin a stale
      # version (and name a commit that may not exist), so it must not be
      # tracked.
      - name: debian/changelog is not committed
        run: |
          git rev-parse --is-inside-work-tree
          if git ls-files --error-unmatch debian/changelog; then
            echo "::error file=debian/changelog::debian/changelog is committed, but the build generates it: git rm it"
            exit 1
          fi
      - uses: astral-sh/setup-uv@v6
      - run: uv python install ${{ matrix.python-version }}
      - run: uv sync --dev --extra ipmi --python ${{ matrix.python-version }}
      - run: uv run pytest -v -m "not integration"
      - run: uv run ruff check

  integration:
    # The real ezsnmp C-extension against a local snmpsim agent, two
    # independent ways: the Debian python3-ezsnmp package (the artifact the
    # packages depend on) and a pip-installed ezsnmp built from source. A
    # regression in either path fails.
    name: integration (${{ matrix.ezsnmp }} ezsnmp)
    runs-on: ubuntu-24.04
    container: debian:trixie
    strategy:
      fail-fast: false
      matrix:
        ezsnmp: [apt, pip]
    steps:
      - name: Common test deps
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            python3 python3-paho-mqtt python3-pytest python3-pip git
          # snmpsim from pip: the conftest expects `snmpsim-command-responder`
          # (snmpsim-lextudio); trixie's apt `snmpsim` (0.4.5) ships a different
          # command name.
          pip install --break-system-packages snmpsim-lextudio

      - name: ezsnmp from the Debian package (deployed artifact)
        if: matrix.ezsnmp == 'apt'
        run: apt-get install -y --no-install-recommends python3-ezsnmp

      - name: ezsnmp from PyPI (compiled from source)
        if: matrix.ezsnmp == 'pip'
        run: |
          # libsnmp-dev provides the net-snmp headers + net-snmp-config; python3-dev
          # provides Python.h; build-essential provides the compiler.
          apt-get install -y --no-install-recommends libsnmp-dev build-essential python3-dev
          pip install --break-system-packages 'ezsnmp~=1.1'

      - uses: actions/checkout@v5
      - name: Trust repo directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Run integration tests (real ezsnmp + snmpsim)
        run: PYTHONPATH=src python3 -m pytest tests/integration -m integration -v

  build-deb:
    name: build-deb (${{ matrix.suite }} ${{ matrix.arch }})
    needs: [test, integration]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        suite: [bookworm, trixie, forky, sid]
        arch: [all]
    steps:
      - name: Check out
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # full history + tags: the version is git describe's

      # The shared build: debian:<suite>, the dependency repositories
      # .github/apt-packaging.toml declares for the suite (paho-mqtt-bookworm
      # on bookworm), build deps from debian/control, and the version from
      # the shared deb-version.py (with ~deb<R>, and ~pr<P> on a pull
      # request). Writes the .debs to built-debs/.
      - name: Build
        id: build
        uses: mithro/apt-repo-action/build-deb@main
        with:
          suite: ${{ matrix.suite }}
          arch: ${{ matrix.arch }}

      # paho-mqtt-bookworm is bundled (.github/apt-packaging.toml): its
      # packages that ours need are served from our own bookworm suite. So
      # the install test takes them from the bundle, not from
      # paho-mqtt-bookworm's repository, which proves a user needs only
      # ours (apt-repo-action docs/packaging.md, "Bundling a dependency
      # repository"). Dependency repositories that aren't bundled (none
      # today) are still added.
      - name: Check out apt-repo-action's scripts
        uses: actions/checkout@v5
        with:
          repository: mithro/apt-repo-action
          ref: main
          path: .apt-repo-action
          sparse-checkout: scripts

      - name: The bundled packages, and the other dependency repositories
        id: bundle
        env:
          SUITE: ${{ matrix.suite }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          mkdir -p bundled-debs
          python3 .apt-repo-action/scripts/bundle-depends.py fetch \
            --suite "$SUITE" --debs built-debs --dest bundled-debs --index
          python3 .apt-repo-action/scripts/apt-sources.py write --unbundled \
            --suite "$SUITE" --dest "$RUNNER_TEMP/apt-sources-unbundled" > /dev/null
          echo "apt-sources=$RUNNER_TEMP/apt-sources-unbundled" >> "$GITHUB_OUTPUT"
          ls -l bundled-debs

      # Install what was just built into a clean container of the same suite,
      # with only our repository's packages (built and bundled) and any
      # unbundled dependency repository, and check it (including the systemd
      # start/restart policy of #36) before anything is published.
      - name: Install test
        env:
          SUITE: ${{ matrix.suite }}
          APT_SOURCES: ${{ steps.bundle.outputs.apt-sources }}
        run: |
          # --platform: an Architecture: all build runs on this runner's own
          # architecture, and an earlier pull may have pointed the tag elsewhere.
          docker run --rm --platform linux/amd64 \
            -v "$APT_SOURCES:/apt-sources:ro" \
            -v "$PWD/built-debs:/debs:ro" \
            -v "$PWD/bundled-debs:/bundled:ro" \
            -v "$PWD/packaging:/packaging:ro" \
            "debian:$SUITE" sh /packaging/install-test.sh

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: debs-${{ matrix.suite }}-${{ matrix.arch }}
          path: built-debs/*.deb
          if-no-files-found: error
          retention-days: 14

  publish-apt:
    # Scoped to this job alone. A job calling a reusable workflow sets the
    # maximum permissions available to it, so the elevated Pages scopes stay
    # here rather than applying to the whole workflow.
    permissions:
      contents: read
      pages: write
      id-token: write
    # Build and install-test pull requests, but never publish from one (or
    # from any branch but main): that would overwrite the live repository
    # with unreviewed packages.
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    needs: build-deb
    uses: mithro/apt-repo-action/.github/workflows/publish-apt.yml@main
    with:
      suites: "bookworm trixie forky sid"
      # dh-python builds these Architecture: all; one deb serves every arch.
      architectures: "all"
      description: "Publish hardware sensor data to Home Assistant via MQTT"
    secrets:
      gpg-private-key: ${{ secrets.APT_GPG_PRIVATE_KEY }}

  verify-apt:
    # After publishing, install the just-published packages from the LIVE apt
    # repository on a fresh trixie system and smoke test them end-to-end:
    # catches what the pre-publish install test cannot (a broken publish, a
    # repository that serves the wrong thing). The version comes from this
    # run's own trixie .debs, and the install pins to it and waits for it to
    # appear, so a slow Pages deploy cannot let a stale package pass.
    needs: publish-apt
    runs-on: ubuntu-24.04
    container: debian:trixie
    steps:
      - name: Base tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git python3-pip
      - uses: actions/checkout@v5  # for the snmprec fixtures + smoke_test.py
      - name: Trust repo directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: This run's trixie packages
        uses: actions/download-artifact@v5
        with:
          name: debs-trixie-all
          path: built-debs
      - name: Install the just-published version from the apt repo (wait for it)
        run: |
          set -eu
          VERSION=$(dpkg-deb -f built-debs/python3-sensors2mqtt_*.deb Version)
          # [trusted=yes]: a functional smoke test, not a signature test.
          echo "deb [trusted=yes] https://mith.ro/sensors2mqtt/trixie/ ./" \
            > /etc/apt/sources.list.d/sensors2mqtt.list
          echo "waiting for sensors2mqtt $VERSION to appear in the apt repo"
          ok=
          for i in $(seq 1 20); do
            apt-get update || true
            # Pinned to the just-built version so a stale repo snapshot cannot pass.
            if apt-get install -y --no-install-recommends \
                 "sensors2mqtt-snmp=$VERSION" "sensors2mqtt-snmp-control=$VERSION"; then
              ok=1; break
            fi
            echo "attempt $i: $VERSION not in the apt repo yet, retrying in 20s"; sleep 20
          done
          test -n "$ok" || { echo "sensors2mqtt $VERSION never appeared in the apt repo"; exit 1; }
          dpkg -s python3-sensors2mqtt | grep '^Version:'
      - name: snmpsim for the smoke test
        run: pip install --break-system-packages snmpsim-lextudio
      - name: Smoke test the installed Debian packages
        run: python3 packaging/smoke_test.py
